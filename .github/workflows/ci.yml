name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (undefined names / syntax errors)
        shell: bash
        run: |
          python -m pyflakes app.py main.py core models scanners scoring utils gui prompt_engine tests \
            | grep -vE "imported but unused|assigned to but never used|f-string is missing placeholders" \
            | tee lint.txt
          test ! -s lint.txt

      - name: Run tests
        run: python -m pytest -q

  scan-demo:
    name: Scan sample project
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install requests packaging

      - name: Scan (CLI works without Qt)
        run: |
          python main.py tests/sample_vulnerable_project -q -e sarif -o results.sarif --fail-on none
          python main.py tests/sample_vulnerable_project -q -o report.html --fail-on none

      - uses: actions/upload-artifact@v4
        with:
          name: securemysite-reports
          path: |
            results.sarif
            report.html
